spring.application.name=api-gateway
server.port=8080

eureka.instance.prefer-ip-address=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Новый префикс для реактивного Gateway (2025.1)
spring.cloud.gateway.server.webflux.routes[0].id=skill-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://skill-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/**

spring.cloud.gateway.server.webflux.routes[1].id=notification-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://notification-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/notifications/**